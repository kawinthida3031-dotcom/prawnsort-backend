<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prawnsort - ระบบจำแนกระยะกุ้งฝอยสำหรับใช้ในฟาร์ม</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-2 sm:p-4 select-none">

    <!-- โครงสร้างคอนเทนเนอร์หลักเดิมตามภาพ 100% -->
    <div class="w-full max-w-5xl h-[90vh] bg-slate-900 rounded-3xl border border-slate-800 p-3 sm:p-4 flex flex-col md:flex-row gap-4 shadow-2xl">
        
        <!-- ฝั่งซ้าย: กล้องส่องสด -->
        <div class="relative flex-1 bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
            <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover"></video>
            <img id="imagePreview" class="w-full h-full object-cover hidden" alt="Captured Shrimp">
            <canvas id="canvas" class="hidden"></canvas>

            <!-- สถานะกล้อง -->
            <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-2 border border-slate-700">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="statusText">กล้องส่องกุ้งพร้อมทำงาน</span>
            </div>
        </div>

        <!-- ฝั่งขวา: แผงแสดงผลและปุ่มกด -->
        <div class="w-full md:w-96 flex flex-col justify-between bg-slate-950/80 rounded-2xl p-4 border border-slate-800/80">
            <div>
                <!-- Header -->
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                    <div class="flex items-center gap-2">
                        <span class="text-2xl">🦐</span>
                        <h1 class="font-bold text-lg text-emerald-400">Prawnsort</h1>
                    </div>
                    <span class="text-[11px] bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">Landscape Mode</span>
                </div>

                <p class="text-xs text-slate-400 mb-2">ระบบจำแนกระยะกุ้งฝอยสำหรับใช้ในฟาร์ม</p>

                <!-- กล่องแสดงผลการวิเคราะห์ -->
                <div class="bg-slate-900/90 rounded-xl p-4 border border-slate-800 min-h-[160px] flex flex-col justify-center">
                    <h3 class="text-xs text-slate-400 mb-2 font-medium">ผลการวิเคราะห์:</h3>
                    <div id="resultContainer" class="space-y-2">
                        <p class="text-sm text-slate-400 italic">กดปุ่มด้านล่างเพื่อถ่ายรูปและเริ่มจำแนกระยะกุ้ง</p>
                    </div>
                </div>
            </div>

            <!-- ปุ่มควบคุมการทำงาน -->
            <div class="mt-4 space-y-2">
                <button id="actionBtn" onclick="handleAction()" class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base">
                    <span>📸</span>
                    <span id="btnText">ถ่ายและวิเคราะห์ AI</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://prawnsort-backend.onrender.com";

        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('canvas');
        const actionBtn = document.getElementById('actionBtn');
        const btnText = document.getElementById('btnText');
        const imagePreview = document.getElementById('imagePreview');
        const resultContainer = document.getElementById('resultContainer');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        let isAnalyzing = false;

        // เริ่มเปิดกล้อง
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้งานกล้องในเบราว์เซอร์");
            }
        }

        async function handleAction() {
            if (isAnalyzing) return;
            await captureAndAnalyze();
        }

        async function captureAndAnalyze() {
            isAnalyzing = true;
            btnText.innerText = "กำลังวิเคราะห์...";
            actionBtn.disabled = true;
            actionBtn.classList.add("opacity-60", "cursor-not-allowed");

            // ย่อขนาดภาพเป็น 640px และบีบอัด JPEG 60% เพื่อส่งข้อมูลเร็วขึ้นหลายเท่า
            const MAX_WIDTH = 640;
            let scale = Math.min(1, MAX_WIDTH / (video.videoWidth || 640));
            canvas.width = (video.videoWidth || 640) * scale;
            canvas.height = (video.videoHeight || 480) * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.6);
            imagePreview.src = imageDataUrl;
            imagePreview.classList.remove('hidden');
            video.classList.add('hidden');

            statusText.innerText = "กำลังประมวลผล AI...";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";

            resultContainer.innerHTML = `
                <div class="flex items-center justify-center py-4 text-emerald-400 gap-2">
                    <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span>กำลังจำแนกระยะกุ้ง...</span>
                </div>
            `;

            try {
                const blob = await (await fetch(imageDataUrl)).blob();
                const formData = new FormData();
                formData.append('file', blob, 'shrimp.jpg');

                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("การเชื่อมต่อเซิร์ฟเวอร์ล้มเหลว");

                const data = await response.json();
                displayResults(data);

                statusText.innerText = "วิเคราะห์เสร็จสิ้น";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-blue-500";

            } catch (err) {
                resultContainer.innerHTML = `
                    <div class="text-rose-400 text-xs">
                        <p class="font-bold">❌ เกิดข้อผิดพลาด</p>
                        <p>ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</p>
                    </div>
                `;
            } finally {
                isAnalyzing = false;
                actionBtn.disabled = false;
                actionBtn.classList.remove("opacity-60", "cursor-not-allowed");
                btnText.innerText = "📸 ถ่ายและวิเคราะห์ AI";
                
                // คืนค่าแสดงกล้องสดหลังจากวิเคราะห์เสร็จสิ้นเพื่อให้ส่องตัวต่อไปได้
                setTimeout(() => {
                    imagePreview.classList.add('hidden');
                    video.classList.remove('hidden');
                    statusText.innerText = "กล้องส่องกุ้งพร้อมทำงาน";
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                }, 3000);
            }
        }

        // แสดงผลระยะ ความมั่นใจ และพยากรณ์วันฟัก
        function displayResults(data) {
            const predictions = data.predictions || [];

            if (predictions.length === 0) {
                resultContainer.innerHTML = `
                    <div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-amber-300 text-xs">
                        <p class="font-bold">⚠️ ไม่พบกุ้งในภาพ</p>
                        <p class="mt-1">กรุณาวางกุ้งให้อยู่ในตำแหน่งแล้วลองถ่ายใหม่</p>
                    </div>
                `;
                return;
            }

            let html = `<div class="space-y-2">`;
            predictions.forEach((pred) => {
                const confPercent = Math.round(pred.confidence || 0);
                const stageName = pred.stage_name || pred.class || "ไม่ระบุระยะ";
                const forecast = pred.hatch_forecast || "ไม่สามารถประมาณการได้";

                html += `
                    <div class="space-y-1">
                        <p class="text-sm font-bold text-emerald-400">ระยะ: <span class="text-white">${stageName}</span></p>
                        <p class="text-xs text-sky-300 font-semibold">ความมั่นใจ: ${confPercent}%</p>
                        <p class="text-xs text-amber-300 font-semibold pt-1 border-t border-slate-800">🗓️ พยากรณ์วันฟัก: ${forecast}</p>
                    </div>
                `;
            });
            html += `</div>`;

            resultContainer.innerHTML = html;
        }

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
